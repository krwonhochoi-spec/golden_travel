<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부부 여행기</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1eef2;--paper:#ffffff;--ink:#2a2229;--sub:#6c6069;--accent:#b8475f;--line:#d9ced6;--gold:#3f6f5e;--hero:#3a2433;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131a;--paper:#221c24;--ink:#eee6ec;--sub:#ab9ca7;--accent:#e07a92;--line:#3a3039;--gold:#7fb7a2;--hero:#2a1824;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17131a;--paper:#221c24;--ink:#eee6ec;--sub:#ab9ca7;--accent:#e07a92;--line:#3a3039;--gold:#7fb7a2;--hero:#2a1824;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* 히어로: 처남네 여행기와 동일 구조, 커버 사진은 최신 Vol에서 자동 */
.hero{position:relative;min-height:clamp(380px,56vh,580px);display:flex;align-items:flex-end;color:#fff;background:var(--hero) center/cover no-repeat}
.hero .in{max-width:1080px;margin:0 auto;padding:48px 20px 64px;width:100%}
.hero .tag{display:inline-block;border:1px solid rgba(255,255,255,.6);padding:3px 12px;border-radius:99px;font-size:13px;letter-spacing:.04em}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.15;margin:14px 0 10px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;font-size:clamp(15px,2.2vw,18px);opacity:.92}

/* 시리즈 경로: 처남네 여행기의 동선 카드를 Vol 연결선으로 */
.route{max-width:1080px;margin:-34px auto 0;padding:0 16px;position:relative;z-index:2}
.route ol{list-style:none;margin:0;padding:16px;background:var(--paper);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);display:flex;flex-wrap:wrap;gap:6px 4px;font-size:14px}
.route li{display:flex;align-items:center;gap:4px}
.route li:not(:last-child)::after{content:"→";color:var(--accent);margin-left:4px}
.route a{text-decoration:none}.route a:hover{text-decoration:underline}
.route b{color:var(--accent)}
.route .todo{color:var(--sub)}

.years{max-width:1080px;margin:22px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.years button{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.years button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:1080px;margin:0 auto;padding:40px 16px 20px;position:relative}
main::before{content:"";position:absolute;left:31px;top:40px;bottom:0;width:2px;background:var(--line)}
.ch{position:relative;padding-left:44px;margin-bottom:48px}
.dot{position:absolute;left:8px;top:10px;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--bg)}
.ch header{display:flex;gap:14px;align-items:flex-start}
.no{font-size:40px;font-weight:800;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.time{margin:0;color:var(--sub);font-size:13px}
h2{margin:2px 0 0;font-size:clamp(21px,3.4vw,28px);letter-spacing:-.01em;line-height:1.3}
.intro{color:var(--sub);margin:12px 0 18px;max-width:720px}

.vol{display:grid;grid-template-columns:1fr;background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);text-decoration:none;color:inherit}
.vol .ph{position:relative;background:#000}
.vol .ph img{display:block;width:100%;height:min(56vw,360px);object-fit:cover}
.vol .ts{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.vol .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.vol .cap{margin:0;font-size:15px}
.vol .meta{display:flex;flex-wrap:wrap;gap:6px}
.vol .meta span{font-size:12.5px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.vol .open{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.vol:hover{box-shadow:0 10px 28px rgba(0,0,0,.14)}
@media (min-width:760px){.vol{grid-template-columns:1.25fr 1fr}.vol .ph img{height:100%;min-height:280px}.vol .body{padding:22px}}

.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;color:var(--sub)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty ol{margin:10px 0 0;padding-left:20px}
.empty li{margin:3px 0}

footer{text-align:center;color:var(--sub);font-size:13px;padding:10px 16px 50px}
@media (max-width:640px){main::before{left:23px}.ch{padding-left:34px}.dot{left:0}.no{font-size:30px}}
</style>
<style id="font-up">
/* 폰트 2단계 확대 (약 1.25배) */
body{font-size:17.5px}
.hero .tag{font-size:16px}
.hero h1{font-size:clamp(40px,8.5vw,78px)}
.hero p{font-size:clamp(18px,2.7vw,22px)}
.route ol{font-size:17px}
.years button{font-size:17px}
.no{font-size:48px}
.time{font-size:16px}
h2{font-size:clamp(25px,4.2vw,34px)}
.vol .cap{font-size:19px}
.vol .meta span{font-size:15.5px}
.vol .open{font-size:18px}
.vol .ts{font-size:14px}
.empty strong{font-size:21px}
footer{font-size:16px}
@media (max-width:640px){.no{font-size:36px}}
</style>
</head>
<body>

<section class="hero" id="hero"><div class="in">
  <span class="tag" id="heroTag">부부 여행 시리즈</span>
  <h1>둘이서 쌓아가는<br>여행의 기록</h1>
  <p id="heroSub">첫 번째 여행기를 기다리는 중</p>
</div></section>

<nav class="route" aria-label="여행기 순서"><ol id="route"></ol></nav>
<div class="years" id="years" hidden></div>
<main id="list"></main>

<footer>
  부부 여행기 · 여행마다 한 편씩 이어집니다<br>
  처남네 여행기(제부도 편)와 같은 포맷 · 사진 시각은 파일명 기준
</footer>

  //   title:"제목", line:"한 줄 소개", photos:42, stops:4, url:"vol03-지역/", cover:"data:image/jpeg;base64,…" },
];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trips = [...TRIPS].sort((a,b) => a.vol - b.vol);
const nextVol = trips.length ? trips[trips.length-1].vol + 1 : 1;

function hero(){
  const latest = trips[trips.length-1];
  if (latest?.cover){
    $("#hero").style.backgroundImage = `linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72)),url("${latest.cover}")`;
  } else {
    $("#hero").style.backgroundImage = "linear-gradient(160deg,#5b2c46 0%,#3a2433 55%,#1f2f2a 100%)";
  }
  if (trips.length){
    const first = trips[0].date.slice(0,4), last = latest.date.slice(0,4);
    const photos = trips.reduce((s,t) => s + (t.photos||0), 0);
    $("#heroTag").textContent = first === last ? `부부 여행 시리즈 · ${first}` : `부부 여행 시리즈 · ${first}–${last}`;
    $("#heroSub").textContent = `지금까지 ${trips.length}편 · 사진 ${photos.toLocaleString()}장`;
  }
}

function route(){
  const items = trips.map(t =>
    `<li><a href="#vol-${pad(t.vol)}"><b>Vol.${pad(t.vol)}</b>&nbsp;${esc(t.place)}</a></li>`);
  items.push(`<li class="todo"><b>Vol.${pad(nextVol)}</b>&nbsp;다음 여행</li>`);
  $("#route").innerHTML = items.join("");
}

function years(active){
  const ys = [...new Set(trips.map(t => t.date.slice(0,4)))];
  if (ys.length < 2) return;
  const box = $("#years"); box.hidden = false;
  box.innerHTML = ["전체", ...ys].map(y =>
    `<button type="button" data-y="${y}" aria-pressed="${y===active}">${y}</button>`).join("");
  box.onclick = e => { const b = e.target.closest("button"); if (b){ years(b.dataset.y); list(b.dataset.y); } };
}

function list(year="전체"){
  const shown = trips.filter(t => year === "전체" || t.date.startsWith(year));
  const html = shown.map(t => `
    <section class="ch" id="vol-${pad(t.vol)}"><div class="dot"></div>
      <header><span class="no">${pad(t.vol)}</span><div>
        <p class="time">${esc(t.date)}${t.dow?` (${esc(t.dow)})`:""} · ${esc(t.days)} · ${esc(t.place)}</p>
        <h2>${esc(t.title)}</h2></div></header>
      <p class="intro">${esc(t.line)}</p>
      <a class="vol" href="${esc(t.url)}">
        <div class="ph">${t.cover?`<img loading="lazy" src="${t.cover}" alt="${esc(t.place)} 여행 대표 사진">`:""}<span class="ts">Vol.${pad(t.vol)}</span></div>
        <div class="body">
          <div class="meta">${t.photos?`<span>사진 ${t.photos}장</span>`:""}${t.stops?`<span>들른 곳 ${t.stops}곳</span>`:""}<span>${esc(t.days)}</span></div>
          <span class="open">여행기 열기</span>
        </div>
      </a>
    </section>`).join("");

  const slot = `
    <section class="ch" id="vol-${pad(nextVol)}"><div class="dot" style="background:var(--line)"></div>
      <header><span class="no" style="color:var(--line)">${pad(nextVol)}</span><div>
        <p class="time">다음 여행</p><h2>${trips.length ? "다음 이야기를 기다리는 자리" : "첫 번째 여행기가 들어갈 자리"}</h2></div></header>
      <div class="empty" style="margin-top:16px"><strong>다음 여행은 어디로?</strong>새 여행기가 생기면 이 자리에 한 칸씩 추가됩니다.</div>
    </section>`;
  $("#list").innerHTML = html + (year === "전체" ? slot : "");
}

hero(); route(); years("전체"); list();
</script>
</body>
</html>
